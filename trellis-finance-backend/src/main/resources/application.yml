server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: trellis-finance-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/trellis_db
    username: trellis_user
    password: ${DB_PASSWORD:-trellis_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

app:
  jwt:
    # Set a secure Base64-encoded 256-bit key through APP_JWT_SECRET
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000   # 24 hours

  openai:
    api-key: ${OPENAI_API_KEY:MOCK}   # Set env var to enable real AI; defaults to mock

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.trellisfinance: INFO
    org.springframework.security: WARN
